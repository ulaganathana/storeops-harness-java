name: StoreOps verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Java application
        run: mvn -B verify
      - name: Verify test hygiene
        run: python .harness/scripts/verify-disabled-tests.py
      - name: Verify evaluator determinism
        run: python .harness/scripts/test_compute_verdict.py
