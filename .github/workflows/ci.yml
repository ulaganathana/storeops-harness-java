# Pipeline gate. Independent second line of defence after the Claude Code harness.
# The harness Evaluator runs the same command locally (see CLAUDE.md section 8).
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Checkstyle (RawThrow) + unit/API tests + ArchUnit (A1-A4) + JaCoCo 80/70/60/70 + SpotBugs
      - run: mvn -B verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/surefire-reports
            target/site/jacoco
            target/checkstyle-result.xml
